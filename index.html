<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7056dc"><title>Project Atlas · Focus Bots</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#282744;background:#f8f6ff}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:680px;margin:auto;padding:0 14px 112px;min-height:100vh}.head{padding:24px 4px 10px;display:flex;align-items:center;justify-content:space-between}.head small{color:#8a7aaf;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.head h1{font-size:26px;letter-spacing:-1px;margin:2px 0}.chip{border-radius:50px;padding:7px 11px;background:#e9e3ff;color:#6a51b9;font-size:12px;font-weight:800}.hero{background:linear-gradient(120deg,#6654d8,#a56ce3);color:white;border-radius:23px;padding:20px;box-shadow:0 10px 30px #755dd02c;margin:9px 0 17px}.hero h2{font-size:24px;margin:5px 0;letter-spacing:-.6px}.hero p{margin:7px 0 12px;font-size:13px;opacity:.94;line-height:1.5}.meter{height:9px;border-radius:30px;background:#ffffff40;overflow:hidden}.meter div{height:100%;background:#ffda78;transition:width .2s}.hero-line{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:12px;margin:11px 0 5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:19px 1px 10px}.section-head h2{font-size:17px;margin:0}.section-head span{color:#897f9e;font-size:12px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#eee9ff;color:#5d49b5;font-weight:800;font-size:13px}.btn.primary{background:#6c56d9;color:white}.btn.alt{background:#e6f9e9;color:#197d56}.btn.danger{background:#ffe7e7;color:#b63d5e}.btn.ghost{background:white;border:1px solid #e8e3f4}.btn.small{font-size:12px;padding:8px 10px}.btn.block{width:100%}.card{background:white;border:1px solid #ece8f4;border-radius:20px;margin:9px 0;padding:15px;box-shadow:0 3px 12px #453b7610}.project{display:flex;gap:10px;align-items:center}.projtext{flex:1;min-width:0}.projtext h3{font-size:15px;margin:0 0 5px}.muted{color:#817895;font-size:12px;line-height:1.45}.pill{display:inline-block;font-size:10px;padding:4px 8px;border-radius:9px;background:#f3f0f9;color:#695c87;font-weight:800;margin-right:4px}.progress{height:7px;border-radius:30px;background:#eeeaf8;overflow:hidden;margin:10px 0 6px}.progress div{height:100%;background:#74d6b3}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row.wrap{flex-wrap:wrap}.minitask{display:flex;gap:10px;align-items:start;padding:11px 2px;border-bottom:1px solid #f2eef7}.minitask:last-child{border:0}.minitask input[type=checkbox],.check{accent-color:#6d56db;width:19px;height:19px;flex-shrink:0;margin-top:1px}.taskname{flex:1;min-width:0;line-height:1.4;font-size:13px;font-weight:650}.taskname.done{text-decoration:line-through;color:#aba3b9}.sub{font-size:11px;color:#8e819c;margin-top:4px}.empty{text-align:center;background:#fff;border:2px dashed #e7e0f8;padding:24px 15px;border-radius:17px;color:#7c7194;font-size:13px;line-height:1.6}.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fffffff5;backdrop-filter:blur(10px);border-top:1px solid #eae5f3;z-index:5;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}.tab{max-width:150px;width:25%;display:flex;align-items:center;flex-direction:column;gap:3px;font-size:11px;font-weight:750;color:#968ba7;border:0;background:none;padding:7px 2px}.tab svg{width:21px;height:21px}.tab.active{color:#6b52da}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;color:#625878;margin-bottom:6px}.field input,.field select,.field textarea,.search{display:block;width:100%;border:1px solid #e3deec;border-radius:11px;padding:12px;color:#302d45;background:white}.field textarea{min-height:84px;resize:vertical}.field small{font-size:11px;color:#857a9b}.modalcover{position:fixed;inset:0;background:#17102685;z-index:10;display:flex;justify-content:center;align-items:flex-end}.modal{width:min(100%,680px);max-height:94dvh;overflow:auto;border-radius:22px 22px 0 0;background:#fff;padding:22px 17px calc(24px + env(safe-area-inset-bottom))}.modal h2{font-size:20px;margin:0 0 10px}.routine{display:flex;align-items:center;gap:11px}.routine-icon{background:#fff0d4;width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:22px}.routine-copy{flex:1;min-width:0}.routine-copy h3{font-size:14px;margin:0 0 5px}.weekday{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid #ded7ef;border-radius:10px;padding:9px 0;text-align:center;font-weight:800;font-size:11px;cursor:pointer;color:#847893}.day:has(input:checked){background:#6f56dd;border-color:#6f56dd;color:white}.day input{position:absolute;opacity:0;width:0;height:0}.note{background:#fff8e8;border-radius:13px;padding:12px;color:#806336;font-size:12px;line-height:1.5;margin:13px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#fff;border-radius:15px;padding:13px;border:1px solid #eee9f4}.stat strong{font-size:23px;display:block;color:#6654d4}.stat span{font-size:11px;color:#857996}.bar{margin-top:12px;display:flex;gap:8px;align-items:center}.bar input{flex:1;min-width:0}.tag{font-size:11px;font-weight:800;color:#77698e}.screenreader{position:absolute;clip:rect(0,0,0,0);height:1px;width:1px;overflow:hidden}.bot{position:relative;width:82px;height:86px;flex-shrink:0;background:var(--bg);border-radius:18px;overflow:hidden;isolation:isolate}.bot .body{position:absolute;top:27px;left:21px;width:42px;height:38px;background:var(--c);border-radius:13px;border:2px solid #ffffffaf;transform-origin:50% 100%}.bot .eye{position:absolute;top:12px;width:5px;height:6px;background:#34305b;border-radius:3px}.bot .eye.a{left:10px}.bot .eye.b{right:10px}.bot .mouth{position:absolute;left:17px;top:24px;width:9px;height:3px;border-bottom:2px solid #34305b;border-radius:50%}.bot .arm{position:absolute;top:40px;width:10px;height:23px;background:var(--c);border-radius:7px;z-index:2;transform-origin:top}.bot .arm.left{left:15px}.bot .arm.right{right:15px}.bot .foot{position:absolute;bottom:13px;width:14px;height:8px;background:#6254b2;border-radius:6px}.bot .foot.l{left:25px}.bot .foot.r{right:22px}.bot .prop{position:absolute;z-index:3}.bot[data-mood=active] .desk{bottom:12px;left:8px;width:66px;height:13px;border-radius:7px;background:#6b6a91;box-shadow:0 5px 0 #a39ac7}.bot[data-mood=active] .keyboard{bottom:23px;left:23px;width:38px;height:8px;border-radius:2px;background:#fff;box-shadow:inset 0 -3px #d2ccea}.bot[data-mood=active] .arm{animation:type .28s infinite alternate}.bot[data-mood=active] .arm.right{animation-delay:-.14s}.bot[data-mood=active] .body{animation:lean .5s infinite alternate}.bot[data-mood=paused] .bed{bottom:12px;left:5px;width:73px;height:18px;border-radius:7px;background:#ae9cf0}.bot[data-mood=paused] .pillow{bottom:28px;left:5px;width:23px;height:12px;border-radius:6px;background:white}.bot[data-mood=paused] .body{transform:rotate(-80deg);top:31px;left:32px;animation:breathe 1.9s infinite ease-in-out}.bot[data-mood=paused] .arm,.bot[data-mood=paused] .foot{display:none}.bot[data-mood=paused] .zzz{right:6px;top:5px;color:#7665c0;font-weight:900;font-size:16px;animation:float 2s infinite}.bot[data-mood=blocked] .body{animation:shake .38s infinite}.bot[data-mood=blocked] .sign{top:4px;right:2px;background:#ffdb71;border:2px solid #edab3b;border-radius:6px;padding:0 5px;font-weight:900;animation:bump .6s infinite alternate}.bot[data-mood=blocked] .arm{animation:wave .5s infinite alternate}.bot[data-mood=review] .glass{top:3px;right:5px;font-size:28px;animation:inspect 1.5s infinite alternate}.bot[data-mood=review] .body{animation:lean 1.5s infinite alternate}.bot[data-mood=planning] .book{bottom:5px;right:4px;font-size:22px;animation:write .8s infinite alternate}.bot[data-mood=planning] .bulb{top:2px;right:5px;font-size:23px;animation:float 1.4s infinite alternate}.bot[data-mood=done] .body{animation:jump .7s infinite}.bot[data-mood=done] .arm.left{animation:wave .4s infinite alternate}.bot[data-mood=done] .arm.right{animation:wave .4s -.2s infinite alternate}.bot[data-mood=done] .confetti{top:1px;right:2px;font-size:19px;animation:float 1.1s infinite alternate}@keyframes type{to{transform:rotate(28deg)}}@keyframes lean{to{transform:rotate(5deg)}}@keyframes breathe{50%{transform:rotate(-80deg) scale(1.04)}}@keyframes float{to{transform:translateY(-8px);opacity:.6}}@keyframes shake{25%{transform:translateX(3px)}75%{transform:translateX(-3px)}}@keyframes bump{to{transform:translateY(-5px) rotate(10deg)}}@keyframes wave{to{transform:rotate(-38deg)}}@keyframes inspect{to{transform:translate(-11px,9px) rotate(-18deg)}}@keyframes write{to{transform:rotate(-12deg)}}@keyframes jump{50%{transform:translateY(-14px)}}@media(prefers-reduced-motion:reduce){.bot *,.meter div{animation:none!important;transition:none!important}}@media(max-width:360px){.bot{width:68px}.shell{padding-left:10px;padding-right:10px}.hero{padding:16px}}
</style></head><body><main class="shell"><div class="head"><div><small>PROJECT ATLAS / FOCUS BOTS</small><h1 id="page-title">Your week, simplified</h1></div><span class="chip">v6.0</span></div><div id="app"></div></main><nav class="tabs" aria-label="Sections"><button class="tab active" data-tab="focus"><span>◉</span>Focus</button><button class="tab" data-tab="routines"><span>▦</span>Routine</button><button class="tab" data-tab="projects"><span>▤</span>Projects</button><button class="tab" data-tab="backup"><span>⬡</span>Backup</button></nav><div id="modal-root"></div><div id="toast" role="status" aria-live="polite" class="screenreader"></div><script>
'use strict';
const OLD_KEY='project-atlas-mini-v2',KEY='project-atlas-focus-bots-v6';
const DEMO={projects:[{id:'demo-recipe',name:'Recipe Rocket',status:'active',priority:'P1',description:'A fictional recipe-planning web app.'},{id:'demo-garden',name:'Pocket Garden',status:'planning',priority:'P2',description:'A fictional plant-care assistant.'},{id:'demo-pet',name:'Pet Parade',status:'paused',priority:'P2',description:'A fictional pet costume app.'},{id:'demo-sky',name:'Sky Sketch',status:'blocked',priority:'P1',description:'A fictional creative prototype.'},{id:'demo-study',name:'Study Buddy',status:'review',priority:'P2',description:'A fictional flashcard app.'},{id:'demo-habit',name:'Tiny Wins',status:'done',priority:'P2',description:'A fictional habit tracker.'}],tasks:[{id:'demo-t1',projectId:'demo-recipe',title:'Review first mobile recipe screen',owner:'Me',status:'todo',priority:'P1',estimate:20},{id:'demo-t2',projectId:'demo-recipe',title:'Ask Codex to improve ingredient picker',owner:'Codex',status:'todo',priority:'P1',estimate:10},{id:'demo-t3',projectId:'demo-garden',title:'Choose three sample plants',owner:'Me',status:'todo',priority:'P2',estimate:15},{id:'demo-t4',projectId:'demo-garden',title:'Generate a card layout',owner:'GPT',status:'todo',priority:'P2',estimate:10},{id:'demo-t5',projectId:'demo-study',title:'Test quiz feedback',owner:'Me',status:'todo',priority:'P2',estimate:15}],routines:[{id:'demo-ig',title:'Publish an Instagram post',account:'Demo Studio (fictional)',days:[1,4],estimate:30,active:true},{id:'demo-review',title:'Weekly planning & review',account:'Personal',days:[0],estimate:15,active:true}],weekly:{},activity:[]};
const MOODS={active:'Working',paused:'Sleeping',blocked:'Blocked',review:'Reviewing',planning:'Planning',done:'Celebrating'};
const BOT_COLORS=[['#7a64dc','#eae4ff'],['#52bfba','#e3fcf7'],['#f48aa1','#ffe8ef'],['#f4b65e','#fff3d8'],['#8bbb77','#eefaeb'],['#7998e9','#e7edff']];
const clone=x=>JSON.parse(JSON.stringify(x));
const now=()=>new Date().toISOString();
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hashColor(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return BOT_COLORS[h%BOT_COLORS.length]}
function uid(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monday(){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return localDate(d)}
function addDays(date,n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}
function getWeek(date=monday()){if(!data.weekly||typeof data.weekly!=='object')data.weekly={};if(!data.weekly[date])data.weekly[date]={focusIds:[],planIds:[],routineDone:{}};let w=data.weekly[date];if(!Array.isArray(w.focusIds))w.focusIds=[];if(!Array.isArray(w.planIds))w.planIds=[];if(!w.routineDone||typeof w.routineDone!=='object')w.routineDone={};return w}
function normalize(o){if(!o||!Array.isArray(o.projects)||!Array.isArray(o.tasks))throw Error('This is not a Project Atlas backup.');let x=clone(o);x.projects=x.projects.filter(p=>p&&typeof p.id==='string').map(p=>({...p,status:MOODS[p.status]?p.status:'planning',priority:p.priority||'P2'}));let ids=new Set(x.projects.map(p=>p.id));x.tasks=x.tasks.filter(t=>t&&typeof t.id==='string'&&ids.has(t.projectId)).map(t=>({...t,status:t.status||'todo',estimate:Number(t.estimate)||20}));x.routines=Array.isArray(x.routines)?x.routines.filter(r=>r&&typeof r.id==='string').map(r=>({...r,days:Array.isArray(r.days)?r.days.filter(n=>Number.isInteger(n)&&n>=0&&n<=6):[],active:r.active!==false})):[];x.weekly=x.weekly&&typeof x.weekly==='object'&&!Array.isArray(x.weekly)?x.weekly:{};x.activity=Array.isArray(x.activity)?x.activity:[];return x}
let memoryOnly=false, migrated=false;
function load(){try{let raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw));raw=localStorage.getItem(OLD_KEY);if(raw){migrated=true;return normalize(JSON.parse(raw))}}catch(e){console.warn('Saved data could not be loaded',e)}return clone(DEMO)}
let data=load();let tab='focus',projectSearch='',selectedProject=null,selectedTasks=new Set();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));memoryOnly=false}catch(e){memoryOnly=true;showToast('Storage unavailable — download a backup now')}}
if(migrated)persist();
function showToast(s){const el=document.getElementById('toast');el.className='';el.style.cssText='position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#352c5a;color:white;padding:12px 16px;border-radius:15px;z-index:20;max-width:90%;font-size:12px;text-align:center';el.textContent=s;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>{el.className='screenreader';el.removeAttribute('style')},2800)}
function bot(p){const mood=MOODS[p.status]?p.status:'planning',[c,bg]=hashColor(p.id);const items={active:'<div class="prop keyboard"></div><div class="prop desk"></div>',paused:'<div class="prop bed"></div><div class="prop pillow"></div><div class="prop zzz">Zz</div>',blocked:'<div class="prop sign">!</div>',review:'<div class="prop glass">⌕</div>',planning:'<div class="prop book">✎</div><div class="prop bulb">✦</div>',done:'<div class="prop confetti">✦ ✧</div>'};return `<div class="bot" data-mood="${mood}" style="--c:${c};--bg:${bg}" role="img" aria-label="${escapeHtml(p.name)} bot: ${MOODS[mood]}"><div class="body"><div class="eye a"></div><div class="eye b"></div><div class="mouth"></div></div><div class="arm left"></div><div class="arm right"></div><div class="foot l"></div><div class="foot r"></div>${items[mood]}</div>`}
const openTasks=p=>data.tasks.filter(t=>t.projectId===p&&t.status!=='done');
function taskRow(t,options={}){let done=t.status==='done';return `<div class="minitask"><input type="checkbox" aria-label="Complete ${escapeHtml(t.title)}" data-action="checktask" data-id="${escapeHtml(t.id)}" ${done?'checked':''}><div class="taskname ${done?'done':''}">${escapeHtml(t.title)}<div class="sub">${escapeHtml(t.owner||'Me')} · ${Number(t.estimate)||20} min ${options.project?' · '+escapeHtml(options.project):''}</div></div>${options.plannable?`<button class="btn small ${getWeek().planIds.includes(t.id)?'alt':''}" data-action="toggleplan" data-id="${escapeHtml(t.id)}">${getWeek().planIds.includes(t.id)?'Planned ✓':'+ Week'}</button>`:''}${['GPT','Codex'].includes(t.owner)?`<button class="btn small alt" data-action="copyprompt" data-id="${escapeHtml(t.id)}">Prompt</button>`:''}<button class="btn small ghost" data-action="edittask" data-id="${escapeHtml(t.id)}" aria-label="Edit task">✎</button></div>`}
function focusView(){let w=getWeek(),chosen=w.focusIds.map(id=>data.projects.find(p=>p.id===id)).filter(Boolean),plan=w.planIds.map(id=>data.tasks.find(t=>t.id===id)).filter(t=>t&&t.status!=='done'&&w.focusIds.includes(t.projectId)),completed=w.planIds.filter(id=>data.tasks.some(t=>t.id===id&&t.status==='done')).length,occ=occurrences(),routineDone=occ.filter(o=>w.routineDone[o.key]).length,total=w.planIds.length+occ.length,done=completed+routineDone,percent=total?Math.round(done/total*100):0;return `<div class="hero"><small>WEEK OF ${escapeHtml(monday())} · ${escapeHtml(addDays(monday(),6))}</small><h2>Make space for small wins ✦</h2><p>Only 1–2 active projects this week. Your repeating commitments live in Routine, so they won't overload your focus list.</p><div class="hero-line"><span>${done}/${total} weekly actions complete</span><span>${percent}%</span></div><div class="meter"><div style="width:${percent}%"></div></div></div><div class="section-head"><h2>★ This week's projects</h2><span>${chosen.length} / 2 selected</span></div>${chosen.length?chosen.map(p=>projectCard(p,true)).join(''):'<div class="empty">Pick one or two projects from the library.<br>Everything else can wait.</div>'}<button class="btn primary block" data-action="choosefocus">${chosen.length?'Change focus projects':'Choose focus projects'}</button><div class="section-head"><h2>✓ Small wins to finish</h2><span>${completed}/${w.planIds.length} done · max 5</span></div>${plan.length?plan.map(t=>taskRow(t,{project:data.projects.find(p=>p.id===t.projectId)?.name})).join(''):'<div class="empty">Add up to five small project tasks to this week. Break big work into 15–30 minute steps.</div>'}<button class="btn block" data-action="chooseplan" ${!chosen.length?'disabled':''}>+ Choose this week's tasks</button><div class="section-head"><h2>↻ Routine commitments</h2><span>${routineDone}/${occ.length} done</span></div>${occ.length?occ.sort((a,b)=>a.day-b.day).map(o=>routineRow(o)).join(''):'<div class="empty">No routines scheduled this week. Add Instagram posting or other recurring work.</div>'}<button class="btn block" data-tab="routines">Manage weekly routines</button><div class="note">Tip: Choose fewer tasks than you think you can do. Complete the smallest one first, then add more only when you have space.</div>`}
function projectCard(p,focused=false){let ts=data.tasks.filter(t=>t.projectId===p.id),done=ts.filter(t=>t.status==='done').length,remaining=ts.length-done;return `<div class="card"><div class="project">${bot(p)}<div class="projtext"><h3>${escapeHtml(p.name)}</h3><span class="pill">${MOODS[p.status]}</span><span class="pill">${remaining} open tasks</span><div class="progress"><div style="width:${ts.length?Math.round(done/ts.length*100):0}%"></div></div><div class="muted">${escapeHtml(p.description||'')}</div></div></div><div class="btnrow"><button class="btn small" data-action="openproject" data-id="${escapeHtml(p.id)}">Open tasks</button><button class="btn small ghost" data-action="editproject" data-id="${escapeHtml(p.id)}">Edit</button>${focused?`<button class="btn small danger" data-action="removefocus" data-id="${escapeHtml(p.id)}">Unfocus</button>`:getWeek().focusIds.includes(p.id)?'<span class="pill">★ Focused</span>':`<button class="btn small alt" data-action="addfocus" data-id="${escapeHtml(p.id)}">★ Focus</button>`}</div></div>`}
function occurrences(){const start=monday();return data.routines.filter(r=>r.active!==false).flatMap(r=>(r.days||[]).filter(d=>Number.isInteger(d)&&d>=0&&d<7).map(d=>({routine:r,day:d,date:addDays(start,d),key:r.id+'|'+addDays(start,d)})))}
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function routineRow(o){let checked=!!getWeek().routineDone[o.key];return `<div class="minitask"><input type="checkbox" data-action="routinedone" data-id="${escapeHtml(o.key)}" aria-label="Complete ${escapeHtml(o.routine.title)}" ${checked?'checked':''}><div class="taskname ${checked?'done':''}">${escapeHtml(o.routine.title)}<div class="sub">${DAYS[o.day]} · ${escapeHtml(o.routine.account||'General')} · ${Number(o.routine.estimate)||20} min</div></div></div>`}
function routinesView(){let occ=occurrences(),finished=occ.filter(o=>getWeek().routineDone[o.key]).length;return `<div class="hero"><small>REPEAT WITHOUT REPLANNING</small><h2>Your weekly rhythm</h2><p>Set routine tasks once. New checkboxes appear every week, while previous weeks' records are retained.</p><div class="hero-line"><span>${finished} / ${occ.length} this week</span><span>Routine</span></div></div><div class="section-head"><h2>Recurring commitments</h2><button class="btn primary small" data-action="editroutine">+ New</button></div>${data.routines.length?data.routines.map(r=>`<div class="card"><div class="routine"><div class="routine-icon">↻</div><div class="routine-copy"><h3>${escapeHtml(r.title)}</h3><div class="muted">${escapeHtml(r.account||'General')} · ${(r.days||[]).map(d=>DAYS[d]).join(', ')||'No days'} · ${Number(r.estimate)||20} min</div></div><button class="btn small ghost" data-action="editroutine" data-id="${escapeHtml(r.id)}">Edit</button></div></div>`).join(''):'<div class="empty">Add your first recurring responsibility.</div>'}<div class="section-head"><h2>This week's routine checklist</h2></div>${occ.length?occ.sort((a,b)=>a.day-b.day).map(routineRow).join(''):'<div class="empty">No scheduled checkboxes yet.</div>'}`}
function projectsView(){if(selectedProject){let p=data.projects.find(p=>p.id===selectedProject);if(!p){selectedProject=null;return projectsView()}return `<div class="btnrow"><button class="btn small" data-action="back">← All projects</button></div>${projectCard(p)}<div class="section-head"><h2>Project tasks</h2><button class="btn small primary" data-action="edittask" data-project="${escapeHtml(p.id)}">+ Task</button></div>${data.tasks.filter(t=>t.projectId===p.id).map(t=>taskRow(t,{plannable:getWeek().focusIds.includes(p.id)})).join('')||'<div class="empty">No tasks yet. Start with one small next action.</div>'}<div class="btnrow"><button class="btn danger" data-action="deleteproject" data-id="${escapeHtml(p.id)}">Delete project</button></div>`}let query=projectSearch.toLowerCase(),list=data.projects.filter(p=>(p.name+' '+(p.description||'')).toLowerCase().includes(query));return `<div class="section-head"><h2>Project parking lot</h2><button class="btn primary small" data-action="editproject">+ Project</button></div><div class="muted">Keep all your ideas here. Only two can take a focus slot each week.</div><div class="bar"><input class="search" id="project-search" placeholder="Find a project..." value="${escapeHtml(projectSearch)}"><button class="btn small danger" data-action="bulkdelete">Select / delete</button></div>${list.map(p=>projectCard(p)).join('')||'<div class="empty">No matching projects.</div>'}`}
function backupView(){return `<div class="hero"><small>PRIVATE DATA, PUBLIC DEMO</small><h2>Keep your projects yours</h2><p>GitHub publishes the fictional sample data in the HTML. Your personal projects and routines remain in this browser, unless you export them.</p></div><div class="card"><h3>Back up your work</h3><p class="muted">Includes all projects, tasks, focus plans, routines and weekly checkmarks.</p><button class="btn primary block" data-action="export">Download private JSON backup</button></div><div class="card"><h3>Restore on your phone</h3><p class="muted">Choose a JSON backup from an older Atlas version or this version. Import replaces the current browser data after confirmation.</p><label class="btn block" style="display:block;text-align:center" for="import-file">Choose JSON backup</label><input id="import-file" type="file" accept=".json,application/json" style="position:absolute;opacity:0;width:1px;height:1px"></div><div class="card"><h3>Start fresh</h3><p class="muted">Reset to fictional public-safe demo projects and routine samples.</p><button class="btn danger block" data-action="reset">Reset all local data</button></div><div class="note">This is local-only, not encrypted or synced. Never commit your private JSON backup to GitHub. Browser data can disappear when site data is cleared or the browser changes. ${memoryOnly?'⚠ Local saving is not available in this browser. Export your data now.':''}</div>`}
function render(){document.querySelectorAll('[data-tab].tab').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));document.getElementById('page-title').textContent=({focus:'Your week, simplified',routines:'Repeat the essentials',projects:'Your idea library',backup:'Save it safely'})[tab];document.getElementById('app').innerHTML=({focus:focusView,routines:routinesView,projects:projectsView,backup:backupView})[tab]();}
function modal(title,html){document.getElementById('modal-root').innerHTML=`<div class="modalcover" id="modalcover"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="row"><h2>${escapeHtml(title)}</h2><button class="btn small ghost" data-action="close">✕</button></div>${html}</section></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function editProject(id){let p=data.projects.find(x=>x.id===id)||{name:'',description:'',status:'planning',priority:'P2'};modal(id?'Edit project':'New project',`<form id="project-form" data-id="${escapeHtml(id||'')}"><div class="field"><label>Project name</label><input name="name" required maxlength="100" value="${escapeHtml(p.name)}"></div><div class="field"><label>Description</label><textarea name="description">${escapeHtml(p.description)}</textarea></div><div class="field"><label>Bot status</label><select name="status">${Object.entries(MOODS).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select name="priority">${['P1','P2','P3'].map(k=>`<option ${p.priority===k?'selected':''}>${k}</option>`).join('')}</select></div><button class="btn primary block" type="submit">Save project</button></form>`)}
function editTask(id,projectId){let t=data.tasks.find(x=>x.id===id)||{projectId:projectId||data.projects[0]?.id||'',title:'',owner:'Me',status:'todo',estimate:20,priority:'P2'};modal(id?'Edit task':'Add small task',`<form id="task-form" data-id="${escapeHtml(id||'')}"><div class="field"><label>Task (small and specific)</label><input name="title" required maxlength="160" value="${escapeHtml(t.title)}" placeholder="Example: review one screen"></div><div class="field"><label>Project</label><select name="projectId">${data.projects.map(p=>`<option value="${escapeHtml(p.id)}" ${p.id===t.projectId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select></div><div class="field"><label>Owner</label><select name="owner">${['Me','GPT','Codex'].map(a=>`<option ${t.owner===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Estimate (minutes)</label><input type="number" name="estimate" min="5" max="1440" value="${Number(t.estimate)||20}"></div><div class="field"><label>Status</label><select name="status">${['todo','in-progress','blocked','done'].map(v=>`<option value="${v}" ${t.status===v?'selected':''}>${v}</option>`).join('')}</select></div><button class="btn primary block" type="submit">Save task</button>${id?`<button class="btn danger block" style="margin-top:8px" type="button" data-action="deletetask" data-id="${escapeHtml(id)}">Delete task</button>`:''}</form>`)}
function editRoutine(id){let r=data.routines.find(x=>x.id===id)||{title:'',account:'',days:[1],estimate:30,active:true};modal(id?'Edit routine':'New repeating task',`<form id="routine-form" data-id="${escapeHtml(id||'')}"><div class="field"><label>Routine name</label><input name="title" required maxlength="140" value="${escapeHtml(r.title)}" placeholder="Publish IG post"></div><div class="field"><label>Account / context (optional)</label><input name="account" maxlength="100" value="${escapeHtml(r.account)}" placeholder="Business account name"></div><div class="field"><label>Repeat on</label><div class="weekday">${DAYS.map((d,i)=>`<label class="day"><input type="checkbox" name="days" value="${i}" ${(r.days||[]).includes(i)?'checked':''}>${d}</label>`).join('')}</div></div><div class="field"><label>Estimated minutes per occurrence</label><input type="number" min="5" max="1440" name="estimate" value="${Number(r.estimate)||30}"></div><div class="field"><label><input type="checkbox" name="active" ${r.active!==false?'checked':''}> Active routine</label></div><button class="btn primary block" type="submit">Save routine</button>${id?`<button class="btn danger block" style="margin-top:8px" data-action="deleteroutine" data-id="${escapeHtml(id)}" type="button">Delete routine</button>`:''}</form>`)}
function chooseFocus(){let w=getWeek();modal('Choose up to 2 projects',`<p class="muted">Only selected projects appear in your Focus tab. You can change them anytime.</p>${data.projects.filter(p=>p.status!=='done').map(p=>`<label class="minitask"><input type="checkbox" class="focus-choice check" value="${escapeHtml(p.id)}" ${w.focusIds.includes(p.id)?'checked':''}><span class="taskname">${escapeHtml(p.name)}<div class="sub">${MOODS[p.status]}</div></span></label>`).join('')}<button class="btn primary block" data-action="savefocus">Save this week's focus</button>`)}
function choosePlan(){let w=getWeek(),tasks=data.tasks.filter(t=>w.focusIds.includes(t.projectId)&&t.status!=='done');modal('Choose up to 5 small tasks',`<p class="muted">Plan concrete, finishable actions. Existing completed selections will remain counted this week.</p>${tasks.map(t=>`<label class="minitask"><input type="checkbox" class="plan-choice check" value="${escapeHtml(t.id)}" ${w.planIds.includes(t.id)?'checked':''}><span class="taskname">${escapeHtml(t.title)}<div class="sub">${escapeHtml(t.owner)} · ${Number(t.estimate)||20} min</div></span></label>`).join('')||'<p>No open tasks in selected projects. Add a small task from Projects first.</p>'}<button class="btn primary block" data-action="saveplan">Save weekly task list</button>`)}
function bulkDelete(){modal('Remove unused projects',`<p class="muted">Choose the projects to delete. Their tasks will also be deleted. Download a backup first if unsure.</p>${data.projects.map(p=>`<label class="minitask"><input class="delete-choice check" type="checkbox" value="${escapeHtml(p.id)}"><span class="taskname">${escapeHtml(p.name)}</span></label>`).join('')}<button class="btn danger block" data-action="confirmbulk">Delete selected projects</button>`)}
function removeProjects(ids){const names=data.projects.filter(p=>ids.includes(p.id)).map(p=>p.name);if(!ids.length){showToast('Choose at least one project');return}if(!confirm('Permanently delete '+names.length+' project(s) and all their tasks?'))return;data.projects=data.projects.filter(p=>!ids.includes(p.id));data.tasks=data.tasks.filter(t=>!ids.includes(t.projectId));for(const w of Object.values(data.weekly||{})){w.focusIds=(w.focusIds||[]).filter(id=>!ids.includes(id));w.planIds=(w.planIds||[]).filter(id=>data.tasks.some(t=>t.id===id))}selectedProject=null;closeModal();persist();render();showToast('Removed '+names.length+' project(s)')}
function exportBackup(){let value={...data,schemaVersion:6,exportedAt:now()};let file=new Blob([JSON.stringify(value,null,2)],{type:'application/json'});let url=URL.createObjectURL(file);let a=document.createElement('a');a.href=url;a.download='Project_Atlas_Private_Backup_'+localDate(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function promptFor(t){let p=data.projects.find(p=>p.id===t.projectId);return `Project: ${p?.name||'Unnamed project'}\nProject context: ${p?.description||''}\nTask for ${t.owner}: ${t.title}\nPlease provide a practical result, clear acceptance checklist, and next steps. Do not claim work is completed without evidence.`}
function handleAction(a,b){let id=b.dataset.id,w=getWeek();switch(a){case 'close':closeModal();break;case 'choosefocus':chooseFocus();break;case 'chooseplan':choosePlan();break;case 'savefocus':{let ids=[...document.querySelectorAll('.focus-choice:checked')].map(e=>e.value);if(ids.length>2){showToast('Maximum two focus projects');return}w.focusIds=ids;w.planIds=w.planIds.filter(tid=>data.tasks.some(t=>t.id===tid&&ids.includes(t.projectId)));persist();closeModal();render();break}case 'saveplan':{let ids=[...document.querySelectorAll('.plan-choice:checked')].map(e=>e.value);let completed=w.planIds.filter(tid=>data.tasks.some(t=>t.id===tid&&t.status==='done'));let all=[...new Set([...completed,...ids])];if(all.length>5){showToast('Maximum five planned tasks');return}w.planIds=all;persist();closeModal();render();break}case 'addfocus':{if(w.focusIds.includes(id))return;if(w.focusIds.length>=2){showToast('Two projects already focused — change your selection');return}w.focusIds.push(id);persist();render();break}case 'removefocus':w.focusIds=w.focusIds.filter(x=>x!==id);w.planIds=w.planIds.filter(tid=>data.tasks.some(t=>t.id===tid&&w.focusIds.includes(t.projectId)));persist();render();break;case 'toggleplan':{let t=data.tasks.find(t=>t.id===id);if(!t||!w.focusIds.includes(t.projectId))return;if(w.planIds.includes(id))w.planIds=w.planIds.filter(x=>x!==id);else if(w.planIds.length>=5){showToast('Weekly maximum is five tasks');return}else w.planIds.push(id);persist();render();break}case 'checktask':{let t=data.tasks.find(t=>t.id===id);if(!t)return;t.status=t.status==='done'?'todo':'done';persist();render();break}case 'routinedone':w.routineDone[id]=!w.routineDone[id];persist();render();break;case 'copyprompt':{let t=data.tasks.find(t=>t.id===id);if(t){let value=promptFor(t);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(value).then(()=>showToast('Prompt copied'),()=>window.prompt('Copy this prompt:',value))}else window.prompt('Copy this prompt:',value)}break}case 'editproject':editProject(id);break;case 'edittask':editTask(id,b.dataset.project);break;case 'editroutine':editRoutine(id);break;case 'openproject':tab='projects';selectedProject=id;render();break;case 'back':selectedProject=null;render();break;case 'deleteproject':removeProjects([id]);break;case 'bulkdelete':bulkDelete();break;case 'confirmbulk':removeProjects([...document.querySelectorAll('.delete-choice:checked')].map(x=>x.value));break;case 'deletetask':if(confirm('Delete this task permanently?')){data.tasks=data.tasks.filter(t=>t.id!==id);Object.values(data.weekly||{}).forEach(x=>x.planIds=(x.planIds||[]).filter(v=>v!==id));persist();closeModal();render()}break;case 'deleteroutine':if(confirm('Delete this routine? Historical checkmarks will remain in backup.')){data.routines=data.routines.filter(r=>r.id!==id);persist();closeModal();render()}break;case 'export':exportBackup();break;case 'reset':if(confirm('Reset to fictional demo data? Your local projects and tasks will be replaced. Export a backup first.')){data=clone(DEMO);selectedProject=null;persist();tab='focus';render()}break}}
document.addEventListener('click',e=>{let tabButton=e.target.closest('[data-tab]');if(tabButton){tab=tabButton.dataset.tab;selectedProject=null;render();window.scrollTo(0,0);return}let a=e.target.closest('[data-action]');if(a)handleAction(a.dataset.action,a)});
document.addEventListener('submit',e=>{let f=e.target;if(!['project-form','task-form','routine-form'].includes(f.id))return;e.preventDefault();let v=Object.fromEntries(new FormData(f));let id=f.dataset.id||uid();if(f.id==='project-form'){let old=data.projects.find(p=>p.id===id);let obj={...old,id,name:v.name.trim(),description:v.description.trim(),status:v.status,priority:v.priority,updatedAt:now()};if(!obj.name)return;if(old)Object.assign(old,obj);else data.projects.push(obj)}if(f.id==='task-form'){let old=data.tasks.find(t=>t.id===id);let obj={...old,id,title:v.title.trim(),projectId:v.projectId,owner:v.owner,status:v.status,estimate:Math.max(5,Math.min(1440,Number(v.estimate)||20)),updatedAt:now()};if(!obj.title||!data.projects.some(p=>p.id===obj.projectId))return;if(old)Object.assign(old,obj);else data.tasks.push(obj)}if(f.id==='routine-form'){let old=data.routines.find(r=>r.id===id);let days=[...f.querySelectorAll('input[name="days"]:checked')].map(x=>Number(x.value));if(!days.length){showToast('Choose at least one weekday');return}let obj={...old,id,title:v.title.trim(),account:(v.account||'').trim(),days,estimate:Math.max(5,Math.min(1440,Number(v.estimate)||30)),active:!!f.querySelector('input[name="active"]:checked')};if(!obj.title)return;if(old)Object.assign(old,obj);else data.routines.push(obj)}persist();closeModal();render();showToast('Saved')});
document.addEventListener('input',e=>{if(e.target.id==='project-search'){const pos=e.target.selectionStart;projectSearch=e.target.value;render();let el=document.getElementById('project-search');el?.focus();el?.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{if(e.target.id!=='import-file')return;let f=e.target.files?.[0];if(!f)return;try{if(f.size>5e6)throw Error('Backup is too large (5 MB limit).');let raw=JSON.parse(await f.text()),x=normalize(raw);if(!confirm(`Replace current data with ${x.projects.length} projects, ${x.tasks.length} tasks and ${x.routines.length} routines?`))return;data=x;persist();selectedProject=null;tab='focus';render();showToast('Backup restored')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}});
render();
</script></body></html>
