/* v4: distinct full-body, status-specific bot activities */
.bot-stage{height:116px;overflow:visible;isolation:isolate}
.bot-figure{height:83px;overflow:visible;animation:none!important;transform-origin:35px 65px}
.bot-arm{z-index:2}.bot-head{z-index:3}.bot-foot{z-index:1}
.bot-tool{display:none;position:absolute;z-index:4;pointer-events:none}
.bot-stage .bot-prop{display:none!important}
.bot-stage .bot-label{margin-top:1px}
.bot-figure .bot-body{position:absolute;z-index:1;left:18px;top:53px;width:36px;height:20px;border:2px solid #fff9;background:var(--accent);border-radius:9px 9px 12px 12px}
.bot-figure .bot-foot{top:69px}
.bot-figure .bot-arm{top:53px}
/* WORKING: visibly seated at a desk, both hands striking a miniature keyboard */
.bot-stage[data-mood="active"] .bot-figure{animation:work-bob 1.1s ease-in-out infinite!important}
.bot-stage[data-mood="active"] .bot-tool.keyboard{display:block;left:1px;top:68px;width:70px;height:15px;border:2px solid #6e609a;border-radius:4px;background:repeating-linear-gradient(90deg,#f9fbff 0 6px,#b6a8d4 6px 8px);box-shadow:0 4px 0 #81729e;transform:perspective(60px) rotateX(18deg)}
.bot-stage[data-mood="active"] .bot-tool.monitor{display:block;left:47px;top:43px;width:29px;height:24px;border:3px solid #504b83;border-radius:5px;background:linear-gradient(145deg,#9be6ff,#d8ffec);box-shadow:inset 0 0 0 2px #ffffff9a}
.bot-stage[data-mood="active"] .bot-tool.monitor:after{content:'</>';position:absolute;inset:1px;color:#53488a;font-size:9px;font-weight:900;text-align:center;line-height:17px}
.bot-stage[data-mood="active"] .bot-arm.left{transform-origin:top;animation:press-left .28s ease-in-out infinite alternate!important}
.bot-stage[data-mood="active"] .bot-arm.right{transform-origin:top;animation:press-right .31s ease-in-out infinite alternate!important}
.bot-stage[data-mood="active"] .bot-foot{transform:rotate(8deg)}
/* SLEEPING: whole figure lies flat on a little mattress with pillow and blanket */
.bot-stage[data-mood="paused"] .bot-figure{transform:translate(2px,13px) rotate(76deg) scale(.82);animation:nap-breath 3s ease-in-out infinite!important}
.bot-stage[data-mood="paused"] .bot-tool.bed{display:block;left:-4px;top:73px;width:83px;height:12px;background:#b7a8ef;border-radius:8px;box-shadow:0 4px 0 #8b79c5}
.bot-stage[data-mood="paused"] .bot-tool.pillow{display:block;left:5px;top:59px;width:20px;height:15px;background:#fff;border:2px solid #e7d7fc;border-radius:9px;transform:rotate(-3deg)}
.bot-stage[data-mood="paused"] .bot-tool.blanket{display:block;left:30px;top:56px;width:42px;height:21px;background:linear-gradient(145deg,#b9a0fa,#e6d9ff);border:2px solid #fff;border-radius:5px 12px 8px 6px;transform:rotate(-3deg)}
.bot-stage[data-mood="paused"] .bot-tool.zzz{display:block;left:62px;top:3px;font-size:17px;font-weight:900;color:#a16bd9;animation:rise-zzz 2.4s ease-in-out infinite}
.bot-stage[data-mood="paused"] .bot-antenna{display:none}
.bot-stage[data-mood="paused"] .bot-eye{height:3px;top:12px;box-shadow:none;transform:rotate(-8deg);animation:none!important}
.bot-stage[data-mood="paused"] .bot-mouth{border-bottom:2px solid #d4e8f7}
.bot-stage[data-mood="paused"]:after{display:none}
/* BLOCKED: repeatedly tries to lift a warning sign, head shaking */
.bot-stage[data-mood="blocked"] .bot-figure{animation:stuck-wobble 1.9s ease-in-out infinite!important}
.bot-stage[data-mood="blocked"] .bot-tool.warning{display:block;left:48px;top:3px;width:26px;height:27px;clip-path:polygon(50% 0,100% 93%,0 93%);background:#ffb346;filter:drop-shadow(0 1px 1px #a66d39)}
.bot-stage[data-mood="blocked"] .bot-tool.warning:after{content:'!';position:absolute;inset:6px 0 0;text-align:center;color:#743446;font-size:17px;font-weight:900}
.bot-stage[data-mood="blocked"] .bot-arm.right{animation:stuck-arm .5s ease-in-out infinite alternate!important}
.bot-stage[data-mood="blocked"]:after{display:none}
/* REVIEW: leaning over a bouncing magnifying glass */
.bot-stage[data-mood="review"] .bot-figure{animation:inspect-lean 2s ease-in-out infinite!important}
.bot-stage[data-mood="review"] .bot-tool.glass{display:block;left:45px;top:44px;width:25px;height:25px;border-radius:50%;border:5px solid #5a68ab;background:#b8eeff96;animation:inspect-glass 2s ease-in-out infinite}

.bot-stage[data-mood="review"]:after{display:none}

.bot-stage[data-mood="planning"] .bot-tool.notes{display:block;left:43px;top:56px;width:30px;height:24px;background:repeating-linear-gradient(to bottom,#fff8cf 0 7px,#a9bde4 8px 9px);border:2px solid #9d86ba;border-radius:4px;transform:rotate(-15deg)}

.bot-stage[data-mood="planning"] .bot-tool.bulb{display:block;left:52px;top:-3px;width:21px;height:21px;background:#ffed91;border:2px solid #f8bd4d;border-radius:50%;animation:bulb-glow 2s infinite}
.bot-stage[data-mood="planning"] .bot-tool.bulb:after{content:'';position:absolute;left:6px;top:17px;width:5px;height:7px;background:#a48f65;border-radius:0 0 3px 3px}
.bot-stage[data-mood="planning"] .bot-arm.right{animation:scribble-arm .5s ease-in-out infinite alternate!important}

const KEY='project-atlas-mini-v2';let state={tab:'projects',selected:null,multi:false,checked:new Set(),search:'',todoFilter:'open',projectFilter:'all'};
function clone(x){return JSON.parse(JSON.stringify(x))}
function valid(x){return x&&Array.isArray(x.projects)&&Array.isArray(x.tasks)}
let data=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));return valid(x)?x:clone(SEED)}catch(e){return clone(SEED)}})();
let memoryOnly=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));memoryOnly=false}catch(e){memoryOnly=true;toast('Browser storage unavailable. Export a backup to keep your changes.')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function count(pid){let t=data.tasks.filter(t=>t.projectId===pid);return [t.filter(t=>t.status==='done').length,t.length]}
function openTasks(){return data.tasks.filter(t=>t.status!=='done')}
function toast(message){let old=document.getElementById('toast');if(old)old.remove();let el=document.createElement('div');el.id='toast';el.textContent=message;el.style.cssText='position:fixed;z-index:30;bottom:90px;left:50%;transform:translateX(-50%);background:#23364d;color:white;padding:12px 15px;border-radius:12px;max-width:90%;font-size:12px;box-shadow:0 7px 25px #18263b33';document.body.appendChild(el);setTimeout(()=>el.remove(),3000)}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));let el=document.getElementById('app');if(state.tab==='projects')el.innerHTML=projectsView();else if(state.tab==='todos')el.innerHTML=todosView();else el.innerHTML=backupView()}
function stats(){return `<div class="summary"><div class="stat"><strong>${data.projects.length}</strong><span>Projects</span></div><div class="stat"><strong>${openTasks().length}</strong><span>Open tasks</span></div><div class="stat"><strong>${data.tasks.filter(x=>x.status==='blocked').length}</strong><span>Blocked</span></div></div>`}
const MOODS={active:['Working','Typing away'],paused:['Sleeping','Taking a nap'],blocked:['Stuck','Needs your help'],review:['Thinking','Checking results'],done:['Celebrating','Mission complete'],planning:['Planning','Making ideas']};
const BOT_COLORS=[['#a27eff','#d2b9ff'],['#53c9df','#bdf6ef'],['#fc83ba','#ffd0e4'],['#ffc36d','#ffe4a3'],['#83d898','#cdf7b5'],['#8da5fc','#d5dbff'],['#fd998b','#ffdbba']];
function colorFor(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return BOT_COLORS[h%BOT_COLORS.length]}
function moodFor(p){return MOODS[p.status]?p.status:'planning'}
function botMarkup(p){let mood=moodFor(p),[accent,tint]=colorFor(p.id);return `<div class="bot-stage" data-mood="${mood}" style="--accent:${accent};--tint:${tint};--delay:-${(p.id.length%7)*.31}s" role="img" aria-label="Animated bot for ${esc(p.name)}, ${MOODS[mood][0].toLowerCase()}"><div class="bot-figure"><div class="bot-antenna"></div><div class="bot-ear left"></div><div class="bot-ear right"></div><div class="bot-arm left"></div><div class="bot-arm right"></div><div class="bot-body"></div><div class="bot-head"><div class="bot-face"><span class="bot-eye left"></span><span class="bot-eye right"></span><span class="bot-cheek left"></span><span class="bot-cheek right"></span><span class="bot-mouth"></span></div></div><div class="bot-foot left"></div><div class="bot-foot right"></div><div class="bot-tool keyboard"></div><div class="bot-tool monitor"></div><div class="bot-tool bed"></div><div class="bot-tool pillow"></div><div class="bot-tool blanket"></div><div class="bot-tool zzz">Z z z</div><div class="bot-tool warning"></div><div class="bot-tool glass"></div><div class="bot-tool notes"></div><div class="bot-tool pencil"></div><div class="bot-tool bulb"></div><div class="bot-tool confetti"></div></div><div class="bot-label">${MOODS[mood][0]}</div><div class="bot-status-line">${MOODS[mood][1]}</div></div>`}
function statusSelect(p){return `<select class="mood-select" data-project-status="${esc(p.id)}" aria-label="Change ${esc(p.name)} status">${Object.entries(MOODS).map(([key,v])=>`<option value="${key}" ${moodFor(p)===key?'selected':''}>${key==='paused'?'Idle / Sleep':key==='active'?'Working':key==='done'?'Completed':key==='review'?'Review':key==='blocked'?'Blocked':'Planning'}</option>`).join('')}</select>`}
function projectsView(){if(state.selected){let p=data.projects.find(p=>p.id===state.selected);if(p)return detail(p);state.selected=null}
let arr=data.projects.filter(p=>(p.name+' '+(p.description||'')).toLowerCase().includes(state.search.toLowerCase())&&(state.projectFilter==='all'||p.status===state.projectFilter));
return stats()+`<div class="sectionrow"><h2>Meet your bots ✦</h2><div class="actions">${state.multi?`<button class="btn small light" data-action="cancel-multi">Cancel</button>`:`<button class="btn small light" data-action="multi">Select</button>`}<button class="btn primary small" data-action="add-project">+ Add</button></div></div><p class="hint">One little bot per project. Change its mood to update project status.</p><div class="toolbar"><input id="search" class="search" placeholder="Find a project or bot" value="${esc(state.search)}" aria-label="Search projects"><select id="project-filter" class="select" style="width:113px;padding:11px 5px"><option value="all" ${state.projectFilter==='all'?'selected':''}>All</option>${Object.keys(MOODS).map(m=>`<option value="${m}" ${state.projectFilter===m?'selected':''}>${m==='paused'?'Idle':m==='done'?'Done':m==='active'?'Working':m[0].toUpperCase()+m.slice(1)}</option>`).join('')}</select></div>${state.multi?`<div class="box row"><span class="hint">${state.checked.size} selected</span><div class="actions"><button class="btn small" data-action="select-visible">Select all</button><button class="btn danger small" data-action="delete-selected" ${state.checked.size?'':'disabled'}>Delete</button></div></div>`:''}${arr.map(p=>{let [d,n]=count(p.id),pct=n?Math.round(d/n*100):0;let [accent]=colorFor(p.id);return `<article class="card project" data-mood="${moodFor(p)}" style="--accent:${accent}">${state.multi?`<input class="check" type="checkbox" data-select="${esc(p.id)}" ${state.checked.has(p.id)?'checked':''} aria-label="Select ${esc(p.name)}">`:''}${botMarkup(p)}<div class="project-main"><button class="project-main" data-open="${esc(p.id)}" style="width:100%"><h3>${esc(p.name)}</h3><div class="meta"><span class="pill ${esc(moodFor(p))}">${esc(p.priority)}</span><span class="pill">${n-d} to do</span></div><p>${esc(p.nextStep||p.description||'No next step yet')}</p></button><div class="project-quick">${statusSelect(p)}<span class="hint">${d}/${n} done</span></div><div class="sparkbar"><i style="width:${pct}%"></i></div></div></article>`}).join('')||'<div class="empty">No bots here yet. Add a project to welcome a new bot!</div>'}<p class="note">Bots reflect the status you set, not live GPT or Codex activity. Data saves to this browser; export a backup before switching devices.</p>`}

function detail(p){let tasks=data.tasks.filter(t=>t.projectId===p.id),[d,n]=count(p.id);return `<button class="btn light small detail-back" data-action="back">← Projects</button><div class="bot-hero">${botMarkup(p)}<div style="flex:1;min-width:0"><h2 class="detail-name" style="margin:0 0 7px">${esc(p.name)}</h2><div class="meta"><span class="pill ${esc(moodFor(p))}">${esc(moodFor(p))}</span></div><div style="margin-top:9px">${statusSelect(p)}</div></div></div><div class="meta"><span class="pill ${esc(p.status)}">${esc(p.status)}</span><span class="pill ${esc(p.priority)}">${esc(p.priority)}</span><span class="pill">${d}/${n} completed</span></div><p class="muted">${esc(p.description||'')}</p><div class="box"><strong>Next step</strong><p class="muted">${esc(p.nextStep||'Not set')}</p><div class="actions"><button class="btn primary" data-action="edit-project" data-id="${esc(p.id)}">Edit</button><button class="btn light" data-action="add-task" data-id="${esc(p.id)}">+ Task</button><button class="btn danger" data-action="delete-one" data-id="${esc(p.id)}">Delete</button></div></div><div class="sectionrow"><h2>Tasks (${tasks.length})</h2></div>${tasks.map(taskCard).join('')||'<div class="empty">No tasks yet. Add your next action.</div>'}`}
function taskCard(t){let project=data.projects.find(p=>p.id===t.projectId),owner=t.owner||'Me';return `<article class="card task"><div class="task-top"><input class="check" aria-label="Mark task completed" type="checkbox" data-task-check="${esc(t.id)}" ${t.status==='done'?'checked':''}><div style="flex:1;min-width:0"><label style="${t.status==='done'?'text-decoration:line-through;color:#7d8998':''}">${esc(t.title)}</label><div class="meta" style="margin-top:7px"><span class="pill ${esc(t.status)}">${esc(t.status)}</span><span class="pill">${esc(owner)}</span><span class="pill ${esc(t.priority)}">${esc(t.priority||'P2')}</span></div>${state.tab==='todos'?`<small>${esc(project?.name||'Unknown project')}</small>`:''}</div></div><div class="task-foot"><span class="hint">${t.due?'Due '+esc(t.due):'No deadline'}</span><div class="actions"><button class="btn small light" data-action="edit-task" data-id="${esc(t.id)}">Edit</button><button class="btn small" data-action="prompt" data-id="${esc(t.id)}">Ask AI</button></div></div></article>`}
function todosView(){let t=data.tasks.filter(t=>data.projects.some(p=>p.id===t.projectId));if(state.todoFilter==='open')t=t.filter(x=>x.status!=='done');if(state.todoFilter==='me')t=t.filter(x=>x.status!=='done'&&/me|user|human/i.test(x.owner||''));if(state.todoFilter==='ai')t=t.filter(x=>x.status!=='done'&&/gpt|codex|ai/i.test(x.owner||''));if(state.todoFilter==='done')t=t.filter(x=>x.status==='done');let rank={blocked:0,todo:1,'in-progress':2,done:3};t.sort((a,b)=>(rank[a.status]??1)-(rank[b.status]??1)||(a.priority||'P2').localeCompare(b.priority||'P2')||String(a.due||'9999').localeCompare(String(b.due||'9999')));return stats()+`<div class="sectionrow"><h2>My to-do list</h2><button class="btn primary small" data-action="add-task">+ Task</button></div><div class="toolbar"><select id="todo-filter" class="select"><option value="open" ${state.todoFilter==='open'?'selected':''}>All open tasks</option><option value="me" ${state.todoFilter==='me'?'selected':''}>I need to do</option><option value="ai" ${state.todoFilter==='ai'?'selected':''}>Ask GPT / Codex</option><option value="done" ${state.todoFilter==='done'?'selected':''}>Completed</option></select></div><p class="hint">${t.length} tasks shown. Tap Ask AI to copy a development prompt.</p>${t.map(taskCard).join('')||'<div class="empty">No tasks in this view.</div>'}`}
function backupView(){return `<div class="sectionrow"><h2>Backup & restore</h2></div><div class="notice"><strong>GitHub-safe demo.</strong> This HTML ships with fictional projects only. Your imported backup is stored locally in this browser and is not uploaded to the GitHub repository. Do not commit your personal JSON backup to GitHub. This is local storage, not encrypted or password-protected.</div><div class="box"><h3>Save your data</h3><p class="muted">Export all projects and tasks to a JSON file. Keep this file when switching phones, browsers, or HTML versions.</p><button class="btn primary wide" data-action="export">Download JSON backup</button></div><div class="box"><h3>Import a backup</h3><p class="muted">Works with Project Atlas starter and Mini JSON backups. Import REPLACES all projects and tasks currently shown here. Your selected backup is read on your device, not sent to GitHub.</p><label class="btn light wide" style="display:block;text-align:center;cursor:pointer" for="import-file">Choose JSON backup</label><input type="file" id="import-file" accept=".json,application/json" class="hidden"></div><div class="box"><h3>Device storage</h3><p class="muted">Your projects stay in this browser for this website origin, not in GitHub or ChatGPT. Another device or browser needs its own import. Clearing site data or private browsing can erase them.</p><p class="hint">${memoryOnly?'Storage blocked — export is essential':'Local auto-save is enabled when supported.'}</p></div><div class="box"><h3>Start over</h3><p class="muted">Reset to six fictional demo projects. This erases your current local data in this browser.</p><button class="btn danger" data-action="reset">Reset all data</button></div>`}
function modal(content){document.getElementById('modal-root').innerHTML=`<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function field(name,label,value='',type='text',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(name,label,values,current){return `<div class="field"><label for="f-${name}">${label}</label><select name="${name}" id="f-${name}">${values.map(x=>`<option value="${esc(x)}" ${x===current?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function txtField(name,label,value=''){return `<div class="field"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}">${esc(value)}</textarea></div>`}
function formActions(){return '<div class="actions" style="margin-top:18px"><button type="submit" class="btn primary">Save</button><button type="button" class="btn light" data-action="close">Cancel</button></div>'}
function editProject(id){let p=data.projects.find(x=>x.id===id),newOne=!p;p=p||{name:'',description:'',nextStep:'',status:'active',priority:'P1'};modal(`<h2>${newOne?'Add project':'Edit project'}</h2><form id="project-form" data-id="${esc(id||'')}">${field('name','Project name',p.name,'text','required maxlength="160"')}${selectField('status','Status',['active','paused','blocked','review','planning','done'],p.status)}${selectField('priority','Priority',['P0','P1','P2','P3'],p.priority)}${txtField('description','Description',p.description)}${txtField('nextStep','Next step',p.nextStep)}${formActions()}</form>`)}
function editTask(id,projectId){let t=data.tasks.find(x=>x.id===id),fresh=!t;t=t||{title:'',projectId:projectId||data.projects[0]?.id||'',owner:'Codex',status:'todo',priority:'P1',acceptance:'',due:''};if(!data.projects.length){toast('Add a project first');return}modal(`<h2>${fresh?'Add task':'Edit task'}</h2><form id="task-form" data-id="${esc(id||'')}">${field('title','Task',t.title,'text','required maxlength="260"')}<div class="field"><label>Project</label><select name="projectId" required class="select">${data.projects.map(p=>`<option value="${esc(p.id)}" ${t.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>${selectField('owner','Owner',['Me','GPT','Codex','Other'],t.owner||'Me')}${selectField('status','Status',['todo','in-progress','blocked','done'],t.status)}${selectField('priority','Priority',['P0','P1','P2','P3'],t.priority||'P1')}${field('due','Deadline',t.due||'','date')}${txtField('acceptance','Definition of done / test',t.acceptance||'')}${formActions()}${!fresh?`<button type="button" class="btn danger" style="margin-top:12px" data-action="delete-task" data-id="${esc(t.id)}">Delete task</button>`:''}</form>`)}
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
function getForm(form){return Object.fromEntries(new FormData(form).entries())}
function deleteProjects(ids){let existing=data.projects.filter(p=>ids.includes(p.id));if(!existing.length)return;let taskCount=data.tasks.filter(t=>ids.includes(t.projectId)).length;if(!confirm(`Delete ${existing.length} project(s) and ${taskCount} associated task(s)?\n\nThis cannot be undone unless you have a backup. Export a JSON backup first if you may want them later.`))return;data.projects=data.projects.filter(p=>!ids.includes(p.id));data.tasks=data.tasks.filter(t=>!ids.includes(t.projectId));data.activity=(data.activity||[]).concat({id:uid(),time:new Date().toISOString(),type:'delete',message:`Removed ${existing.length} project(s) and ${taskCount} task(s).`});save();state.selected=null;state.multi=false;state.checked=new Set();render();toast(`Deleted ${existing.length} project(s)`)}
function promptFor(t){let p=data.projects.find(x=>x.id===t.projectId);return `You are my software development assistant. Continue work on this project using the attached or available source files. Do not assume previous milestones are complete without evidence.\n\nPROJECT: ${p?.name||'Unknown'}\nPROJECT PURPOSE: ${p?.description||'Not specified'}\nCURRENT STATUS: ${p?.status||'Unverified'}\nPROJECT NEXT STEP: ${p?.nextStep||'Not specified'}\n\nTASK: ${t.title}\nRESPONSIBLE: ${t.owner||'AI'}\nPRIORITY: ${t.priority||'P1'}\nACCEPTANCE TESTS: ${t.acceptance||'Define a verifiable completion test.'}\n\nDeliver working changes, tests, clear usage instructions, any known blockers, and exact remaining actions. Do not claim tests were run unless you executed them. At the end, provide a concise completion summary and a JSON update with projectId, taskId, status, evidence, and nextActions for manual import/review. Task ID: ${t.id}.`}
function copyPrompt(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;let prompt=promptFor(t);modal(`<h2>Ask GPT / Codex</h2><p class="muted">Copy this prompt and paste it into the relevant conversation. Your tracker does not send messages automatically.</p><div class="prompt" id="prompt-content">${esc(prompt)}</div><div class="actions" style="margin-top:14px"><button class="btn primary" data-action="copy-prompt" data-id="${esc(id)}">Copy prompt</button><button class="btn light" data-action="close">Close</button></div>`)}
async function doCopy(str){try{await navigator.clipboard.writeText(str);toast('Copied to clipboard')}catch(e){let ta=document.createElement('textarea');ta.value=str;document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();toast(ok?'Copied to clipboard':'Select and copy the prompt manually')}}
function exportFile(){let blob=new Blob([JSON.stringify({...data,schemaVersion:1,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Project_Atlas_Bot_Buddies_Backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
document.body.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;state.selected=null;state.multi=false;state.checked.clear();render();window.scrollTo(0,0);return}let item=e.target.closest('[data-open]');if(item){if(state.multi){let id=item.dataset.open;state.checked.has(id)?state.checked.delete(id):state.checked.add(id)}else state.selected=item.dataset.open;render();return}let b=e.target.closest('[data-action]');if(!b)return;let ac=b.dataset.action,id=b.dataset.id;switch(ac){case 'add-project':editProject();break;case 'edit-project':editProject(id);break;case 'add-task':editTask(null,id);break;case 'edit-task':editTask(id);break;case 'prompt':copyPrompt(id);break;case 'copy-prompt':doCopy(promptFor(data.tasks.find(t=>t.id===id)));break;case 'back':state.selected=null;render();break;case 'multi':state.multi=true;render();break;case 'cancel-multi':state.multi=false;state.checked.clear();render();break;case 'select-visible':{let filtered=data.projects.filter(p=>(p.name+' '+(p.description||'')).toLowerCase().includes(state.search.toLowerCase())&&(state.projectFilter==='all'||p.status===state.projectFilter));let all=filtered.every(p=>state.checked.has(p.id));filtered.forEach(p=>all?state.checked.delete(p.id):state.checked.add(p.id));render();break}case 'delete-selected':deleteProjects([...state.checked]);break;case 'delete-one':deleteProjects([id]);break;case 'delete-task':if(confirm('Delete this task?')){data.tasks=data.tasks.filter(t=>t.id!==id);save();closeModal();render()}break;case 'close':closeModal();break;case 'export':exportFile();break;case 'reset':if(confirm('Reset ALL projects and tasks to fictional demo data? Export a backup first if needed.')){data=clone(SEED);save();state.selected=null;render()}break;}});
document.body.addEventListener('change',async e=>{let t=e.target;if(t.matches('[data-project-status]')){let p=data.projects.find(p=>p.id===t.dataset.projectStatus);if(p&&MOODS[t.value]){p.status=t.value;p.updatedAt=new Date().toISOString();save();render();toast(p.name+' — '+MOODS[t.value][0]);return}}if(t.matches('[data-select]')){t.checked?state.checked.add(t.dataset.select):state.checked.delete(t.dataset.select);render()}if(t.matches('[data-task-check]')){let task=data.tasks.find(x=>x.id===t.dataset.taskCheck);if(task){task.status=t.checked?'done':'todo';task.updatedAt=new Date().toISOString();save();render()}}if(t.id==='todo-filter'){state.todoFilter=t.value;render()}if(t.id==='project-filter'){state.projectFilter=t.value;render()}if(t.id==='import-file'){let f=t.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!valid(x))throw Error('Not a Project Atlas JSON backup');if(!confirm(`Replace current data with ${x.projects.length} projects and ${x.tasks.length} tasks from this backup?`))return;data=x;data.projects=data.projects.filter(p=>p&&typeof p.id==='string');data.tasks=data.tasks.filter(z=>z&&typeof z.projectId==='string'&&data.projects.some(p=>p.id===z.projectId));save();state.selected=null;state.tab='projects';render();toast('Backup imported')}catch(err){alert('Could not import: '+err.message)}}});
document.body.addEventListener('input',e=>{if(e.target.id==='search'){let input=e.target;let a=input.selectionStart,b=input.selectionEnd;state.search=input.value;render();let target=document.getElementById('search');target?.focus();target?.setSelectionRange(a,b)}});
document.body.addEventListener('submit',e=>{let f=e.target;if(f.id==='project-form'){e.preventDefault();let v=getForm(f),id=f.dataset.id;let p=data.projects.find(x=>x.id===id);if(p)Object.assign(p,v,{updatedAt:new Date().toISOString()});else{p={...v,id:uid(),createdAt:new Date().toISOString()};data.projects.unshift(p)}save();closeModal();state.selected=p.id;state.tab='projects';render();toast('Project saved')}else if(f.id==='task-form'){e.preventDefault();let v=getForm(f),id=f.dataset.id;let t=data.tasks.find(x=>x.id===id);if(t)Object.assign(t,v,{updatedAt:new Date().toISOString()});else data.tasks.unshift({...v,id:uid(),createdAt:new Date().toISOString()});save();closeModal();render();toast('Task saved')}});
document.getElementById('modal-root').addEventListener('click',e=>{if(e.target.classList.contains('modalwrap'))closeModal()});
render();
</script></body></html>
